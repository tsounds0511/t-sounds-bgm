    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Sounds | Premium Free BGM Library</title>    
    <!-- タブアイコン（ファビコン）設定 -->
    <link rel="icon" href="./logo.png" type="image/png">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
            background-color: #fbfbfd;
            color: #1d1d1f;
            margin: 0;
            padding: 0 0 40px 0;
        }

        /* ヘッダーナビゲーション */
        .nav-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 10px 20px;
        }
        .nav-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .nav-logo {
            font-weight: 700;
            font-size: 16px;
            color: #1d1d1f;
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .nav-logo img {
            height: 22px;
            width: auto;
        }
        .nav-logo span { color: #fb0100; }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-link {
            color: #6e6e73;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
            white-space: nowrap;
        }
        .nav-link:hover { color: #fb0100; }

        /* スマホ用ハンバーガーボタン（SVGアイコン） */
        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 0 20px;
        }
        
        /* メインヘッダー */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .header h1 {
            color: #1d1d1f;
            margin: 0 0 5px 0;
            font-size: 32px;
            letter-spacing: -0.5px;
        }
        .header p {
            margin: 0;
            color: #6e6e73;
            font-size: 14px;
        }

        /* ランダムピックアップエリア */
        .featured-section {
            background: linear-gradient(135deg, #ffffff 0%, #fff5f5 100%);
            border: 1px solid rgba(251, 1, 0, 0.15);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 36px;
            box-shadow: 0 8px 30px rgba(251, 1, 0, 0.06);
        }
        .featured-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .featured-badge {
            position: relative;
            overflow: hidden;
            background: #fb0100;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(251, 1, 0, 0.3);
        }
        .featured-badge::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transform: skewX(-25deg);
            animation: badgeShine 3.5s infinite;
        }
        @keyframes badgeShine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .shuffle-btn {
            background: #ffffff;
            border: 1px solid #e8e8ed;
            color: #1d1d1f;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .shuffle-btn:hover {
            border-color: #fb0100;
            color: #fb0100;
        }

        /* 検索バー＆フィルター */
        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid #d2d2d7;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: #fb0100;
            box-shadow: 0 0 0 3px rgba(251, 1, 0, 0.1);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #f5f5f7;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            color: #1d1d1f;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover { background-color: #e8e8ed; }
        .filter-btn.active { background-color: #fb0100; color: white; }
        .filter-btn.keep-filter.active { background-color: #1d1d1f; color: white; }

        /* トラックカード */
        .track-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .track-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }
        .thumbnail {
            width: 160px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            object-fit: cover;
            background-color: #f2f2f2;
        }
        .track-info { flex-grow: 1; }
        .track-title {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 6px 0;
        }
        .track-desc {
            font-size: 13px;
            color: #6e6e73;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }
        .tag {
            display: inline-block;
            background: #f5f5f7;
            padding: 4px 10px;
            border-radius: 50px;
            margin-right: 4px;
            font-size: 11px;
            color: #555;
            cursor: pointer;
        }
        .tag:hover { background-color: #e8e8ed; }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            min-width: 280px;
        }
        audio { height: 36px; width: 100%; outline: none; }
        .action-buttons { display: flex; gap: 8px; width: 100%; }
        
        .yt-link, .keep-btn, .download-btn {
            color: #1d1d1f;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            white-space: nowrap;
        }
        .yt-link { background-color: #f5f5f7; flex: 1.2; }
        .yt-link:hover { background-color: #e8e8ed; }
        
        .keep-btn { 
            background-color: #f5f5f7; 
            border: 1px solid #e8e8ed; 
            flex: 0.9;
        }
        .keep-btn:hover { background-color: #e8e8ed; }
        .keep-btn.active {
            background-color: #1d1d1f;
            color: white;
            border-color: #1d1d1f;
        }

        .download-btn { background-color: #fb0100; color: white; flex: 1; }
        .download-btn:hover { background-color: #d90100; }

        /* ダウンロード感謝モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            border: none; background: #f5f5f7;
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; font-weight: bold; color: #555;
        }
        .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }
        .modal-body { font-size: 14px; line-height: 1.6; color: #333; }

        .credit-box {
            background: #f5f5f7;
            border: 1px solid #e8e8ed;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0;
        }
        .credit-text { font-family: monospace; font-size: 13px; color: #1d1d1f; }
        .copy-btn {
            background: #ffffff;
            border: 1px solid #d2d2d7;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .copy-btn:hover { border-color: #fb0100; color: #fb0100; }
        .yt-sub-btn {
            display: block;
            width: 100%;
            background: #fb0100;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(251, 1, 0, 0.2);
            transition: background-color 0.2s;
            box-sizing: border-box;
        }
        .yt-sub-btn:hover { background: #d90100; }
        .dont-show-container {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e8e8ed;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: #6e6e73;
        }

        /* フッター */
        footer {
            text-align: center;
            padding: 40px 20px 20px 20px;
            font-size: 12px;
            color: #86868b;
            border-top: 1px solid #e8e8ed;
            margin-top: 60px;
        }
        footer a { color: #6e6e73; text-decoration: none; margin: 0 8px; }
        footer a:hover { color: #fb0100; }

        @media (max-width: 768px) {
            .track-card { flex-direction: column; align-items: flex-start; }
            .thumbnail, .controls { width: 100%; }

            .hamburger-btn { display: flex; }
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: -20px;
                right: -20px;
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 16px 24px;
                gap: 16px;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
                box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            }
            .nav-links.active { display: flex; }
        }
    </style>
</head>
<body>

    <!-- ヘッダーナビゲーション -->
    <header class="nav-bar">
        <div class="nav-container">
            <a href="./index.html" class="nav-logo">
                <img src="./logo.png" alt="Logo">

            <button class="hamburger-btn" onclick="toggleMenu()" aria-label="メニューを開く">

                    <line x1="3" y1="12" x2="21" y2="12"></line>

                </svg>
            </button>

            <nav class="nav-links" id="nav-links">
                <a href="./terms.html" class="nav-link">利用規約</a>
                <a href="./privacy.html" class="nav-link">プライバシーポリシー</a>
                <a href="./contact.html" class="nav-link">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="header">
            <img src="./logo.png" alt="T-Sounds Logo" class="header-logo">
            <h1>T-Sounds</h1>
            <p>Premium Free BGM Library</p>
        </div>

        <div id="featured-container" class="featured-section" style="display: none;">
            <div class="featured-header">
                <span class="featured-badge">Today's Pick Up</span>
                <button class="shuffle-btn" onclick="renderRandomFeatured()">シャッフル</button>
            </div>
            <div id="featured-card-slot"></div>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="キーワード・タイトル・タグで検索..." oninput="onSearchInput()">
        </div>

        <div class="filters" id="filter-container">
            <button class="filter-btn active" onclick="filterTracks('all', this)">すべて</button>
            <button class="filter-btn keep-filter" id="filter-keep-btn" onclick="filterTracks('keep', this)">キープ (0)</button>
            <button class="filter-btn" onclick="filterTracks('集中', this)">集中</button>
            <button class="filter-btn" onclick="filterTracks('Vlog', this)">Vlog</button>
            <button class="filter-btn" onclick="filterTracks('ゲーム', this)">ゲーム</button>
            <button class="filter-btn" onclick="filterTracks('ピアノ', this)">ピアノ</button>
        </div>

        <div id="loading" style="text-align: center; color: #86868b; padding: 40px 0;">
            <img src="./logo.png" alt="Loading..." style="width: 40px; height: 40px; opacity: 0.6; margin-bottom: 12px; animation: badgeShine 2s infinite ease-in-out;"><br>
            楽曲データを読み込んでいます...
        </div>
        <div id="track-list"></div>
    </div>

    <!-- モーダル：ダウンロード感謝 -->
    <div id="modal-download" class="modal">
        <div class="modal-content" style="text-align: center;">
            <button class="modal-close" onclick="closeDownloadModal()">×</button>
            <img src="./logo.png" alt="Logo" style="width: 48px; height: 48px; margin-bottom: 12px;">
            <div class="modal-title">ダウンロードありがとうございます</div>
            <div class="modal-body">
                <p style="margin: 0 0 16px 0; color: #6e6e73;">クレジット表記をしていただくと活動の励みになります（任意）。</p>
                
                <div class="credit-box">
                    <span class="credit-text" id="credit-text">BGM: T-Sounds</span>
                    <button class="copy-btn" id="copy-btn" onclick="copyCredit()">コピー</button>
                </div>

                <a href="https://www.youtube.com/@t-sounds0511?sub_confirmation=1" target="_blank" class="yt-sub-btn">
                    YouTubeチャンネル登録
                </a>

                <div class="dont-show-container">
                    <label>
                        <input type="checkbox" id="dont-show-checkbox" onchange="handleDontShowChange(this)"> 24時間はこのメッセージを表示しない
                    </label>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© T-Sounds All Rights Reserved.</p>
        <p>
            <a href="./terms.html">利用規約</a> | 
            <a href="./privacy.html">プライバシーポリシー</a> | 
            <a href="./contact.html">お問い合わせ</a>
        </p>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby2O2yfcWU9Z2ZADr-Mf81gbuSJB1AIk6SzccIKCAlRVyAh_UTw3rrbtHdM449ELYti/exec';
        
        let allTracks = []; 
        let currentTag = 'all';
        let keptTrackIds = JSON.parse(localStorage.getItem('keptTrackIds') || '[]');

        async function fetchTracks() {
            try {
                const response = await fetch(API_URL);
                allTracks = await response.json();
                document.getElementById('loading').style.display = 'none';

                updateKeepBadgeCount();

                const urlParams = new URLSearchParams(window.location.search);
                const targetVid = urlParams.get('v');

                if (targetVid) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    const filtered = allTracks.filter(track => track.youtube_id === targetVid);
                    renderTrackCards(filtered);
                } else {
                    renderTrackCards(allTracks);
                    renderRandomFeatured();
                }
            } catch (error) {
                console.error('通信エラー:', error);
                document.getElementById('loading').innerText = 'データの読み込みに失敗しました。';
            }
        }

        function toggleKeep(youtubeId) {
            const index = keptTrackIds.indexOf(youtubeId);
            if (index === -1) {
                keptTrackIds.push(youtubeId);
            } else {
                keptTrackIds.splice(index, 1);
            }
            localStorage.setItem('keptTrackIds', JSON.stringify(keptTrackIds));
            updateKeepBadgeCount();
            applyFilters();

            const featuredSlot = document.getElementById('featured-card-slot');
            if (featuredSlot.children.length > 0) {
                const currentFeaturedId = featuredSlot.querySelector('.download-btn')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
                const track = allTracks.find(t => t.preview_url === currentFeaturedId);
                if (track) featuredSlot.innerHTML = createCardHTML(track);
            }
        }

        function updateKeepBadgeCount() {
            const keepBtn = document.getElementById('filter-keep-btn');
            if (keepBtn) {
                keepBtn.innerText = `キープ (${keptTrackIds.length})`;
            }
        }

        function renderRandomFeatured() {
            if (allTracks.length === 0) return;
            const randomIndex = Math.floor(Math.random() * allTracks.length);
            const track = allTracks[randomIndex];
            
            const slot = document.getElementById('featured-card-slot');
            slot.innerHTML = createCardHTML(track);
            document.getElementById('featured-container').style.display = 'block';
        }

        function applyFilters() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            
            const filtered = allTracks.filter(track => {
                let matchesTag = false;
                if (currentTag === 'all') {
                    matchesTag = true;
                } else if (currentTag === 'keep') {
                    matchesTag = keptTrackIds.includes(track.youtube_id);
                } else {
                    matchesTag = track.tags ? track.tags.includes(currentTag) : false;
                }

                const titleMatch = track.title ? track.title.toLowerCase().includes(keyword) : false;
                const tagMatch = track.tags ? track.tags.toLowerCase().includes(keyword) : false;
                const descMatch = track.description ? track.description.toLowerCase().includes(keyword) : false;
                const matchesKeyword = !keyword || titleMatch || tagMatch || descMatch;

                return matchesTag && matchesKeyword;
            });

            renderTrackCards(filtered);
        }

        function filterTracks(tag, element) {
            currentTag = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (element) element.classList.add('active');
            applyFilters();
        }

        function onSearchInput() {
            applyFilters();
        }

        function createCardHTML(track) {
            const tagsArray = track.tags ? track.tags.split(',') : [];
            const tagsHtml = tagsArray.map(tag => `<span class="tag" onclick="filterTracks('${tag.trim()}', null)">${tag.trim()}</span>`).join('');
            const descHtml = track.description ? `<p class="track-desc">${track.description}</p>` : '';
            
            const isKept = keptTrackIds.includes(track.youtube_id);
            const keepText = isKept ? 'キープ中' : 'キープ';
            const keepClass = isKept ? 'keep-btn active' : 'keep-btn';

            return `
                <div class="track-card">
                    <img src="https://img.youtube.com/vi/${track.youtube_id}/maxresdefault.jpg" class="thumbnail" alt="サムネイル" loading="lazy">
                    <div class="track-info">
                        <h2 class="track-title">${track.title}</h2>
                        ${descHtml}
                        <div>${tagsHtml}</div>
                    </div>
                    <div class="controls">
                        <audio controls controlsList="nodownload" preload="none">
                            <source src="${track.preview_url}" type="audio/mpeg">
                        </audio>
                        <div class="action-buttons">
                            <a href="https://www.youtube.com/watch?v=${track.youtube_id}" target="_blank" class="yt-link">YouTubeで再生</a>
                            <button onclick="toggleKeep('${track.youtube_id}')" class="${keepClass}">${keepText}</button>
                            <button onclick="handleDownload('${track.preview_url}')" class="download-btn">Download</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTrackCards(tracks) {
            const trackList = document.getElementById('track-list');
            trackList.innerHTML = ''; 

            if (tracks.length === 0) {
                if (currentTag === 'keep') {
                    trackList.innerHTML = '<p style="text-align:center; color:#86868b; padding:40px 0;">キープされた楽曲はありません。<br>気になる曲の「キープ」ボタンを押すとここに一覧表示されます。</p>';
                } else {
                    trackList.innerHTML = '<p style="text-align:center; color:#86868b; padding:40px 0;">該当する楽曲が見つかりませんでした。</p>';
                }
                return;
            }

            tracks.forEach(track => {
                trackList.insertAdjacentHTML('beforeend', createCardHTML(track));
            });
        }

        function handleDownload(fileUrl) {
            const a = document.createElement('a');
            a.href = fileUrl;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            const hideUntil = localStorage.getItem('hideDownloadModalUntil');
            const now = new Date().getTime();

            if (!hideUntil || now > parseInt(hideUntil, 10)) {
                document.getElementById('dont-show-checkbox').checked = false;
                document.getElementById('modal-download').style.display = 'flex';
            }
        }

        function closeDownloadModal() {
            document.getElementById('modal-download').style.display = 'none';
        }

        function handleDontShowChange(checkbox) {
            if (checkbox.checked) {
                const expireTime = new Date().getTime() + (24 * 60 * 60 * 1000);
                localStorage.setItem('hideDownloadModalUntil', expireTime);
            } else {
                localStorage.removeItem('hideDownloadModalUntil');
            }
        }

        function copyCredit() {
            const creditText = document.getElementById('credit-text').innerText;
            navigator.clipboard.writeText(creditText).then(() => {
                const copyBtn = document.getElementById('copy-btn');
                copyBtn.innerText = 'コピー完了';
                copyBtn.style.backgroundColor = '#fb0100';
                copyBtn.style.color = '#ffffff';
                copyBtn.style.borderColor = '#fb0100';

                setTimeout(() => {
                    copyBtn.innerText = 'コピー';
                    copyBtn.style.backgroundColor = '#ffffff';
                    copyBtn.style.color = '#1d1d1f';
                    copyBtn.style.borderColor = '#d2d2d7';
                }, 2000);
            });
        }

        function toggleMenu() {
            const navLinks = document.getElementById('nav-links');
            navLinks.classList.toggle('active');
        }

        document.addEventListener('play', function(e){
            const audios = document.getElementsByTagName('audio');
            for(let i = 0, len = audios.length; i < len;i++){
                if(audios[i] != e.target){
                    audios[i].pause();
                }
            }
        }, true);

        fetchTracks();
    </script>
</body>
</html>
