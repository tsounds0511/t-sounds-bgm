<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Sounds | Premium Free BGM Library</title>
    <link rel="icon" href="./logo.png" type="image/png">

    <!-- GA4 タグ -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BPGEB13LX4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BPGEB13LX4');
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
            background-color: #fbfbfd;
            color: #1d1d1f;
            margin: 0;
            padding: 0 0 60px 0;
        }

        /* ヘッダー */
        .nav-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 10px 20px;
        }
        .nav-container {
            max-width: 960px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-logo {
            font-weight: 700; font-size: 16px; color: #1d1d1f;
            text-decoration: none; display: flex; align-items: center; gap: 8px;
        }
        .nav-logo img { height: 22px; }
        .nav-logo span { color: #fb0100; }
        .nav-links { display: flex; gap: 20px; }
        .nav-link { color: #6e6e73; text-decoration: none; font-size: 13px; font-weight: 500; }
        .nav-link:hover { color: #fb0100; }
        .hamburger-btn { display: none; background: none; border: none; cursor: pointer; padding: 4px; }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 30px 20px 0 20px;
        }
        
        .header { text-align: center; margin-bottom: 24px; }
        .header-logo { width: 48px; height: 48px; object-fit: contain; margin-bottom: 8px; }
        .header h1 { color: #1d1d1f; margin: 0 0 4px 0; font-size: 28px; letter-spacing: -0.5px; }
        .header p { margin: 0; color: #6e6e73; font-size: 13px; }

        /* 個別アクセス時の案内バナー */
        .single-notice {
            background: #ffffff;
            border: 1px solid #fb0100;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(251, 1, 0, 0.06);
        }
        .single-notice p { margin: 0; font-size: 13px; color: #1d1d1f; font-weight: 500; }

        /* Today's Pick Up (レスポンシブ整列版) */
        .featured-section {
            background: linear-gradient(135deg, #ffffff 0%, #fff5f5 100%);
            border: 1px solid rgba(251, 1, 0, 0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 25px rgba(251, 1, 0, 0.05);
        }
        .featured-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
        }
        .featured-badge {
            background: #fb0100; color: white; font-size: 11px; font-weight: 700;
            padding: 4px 12px; border-radius: 50px; letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(251, 1, 0, 0.25);
        }
        .shuffle-btn {
            background: #ffffff; border: 1px solid #e8e8ed; color: #1d1d1f;
            font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 50px;
            cursor: pointer; transition: all 0.2s;
        }
        .shuffle-btn:hover { border-color: #fb0100; color: #fb0100; }

        .featured-card {
            display: flex; flex-direction: column; gap: 12px;
        }
        .featured-top {
            display: flex; gap: 14px; align-items: flex-start;
        }
        .featured-thumb-wrap {
            width: 100px; height: 56px; border-radius: 8px; flex-shrink: 0;
        }
        .featured-meta { flex: 1; min-width: 0; }
        .featured-title { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; color: #1d1d1f; }
        .featured-desc {
            margin: 0; font-size: 12px; color: #6e6e73; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        .featured-bottom {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .featured-audio { flex: 1; min-width: 200px; height: 36px; }
        .featured-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

        /* ツールバー */
        .toolbar {
            display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
            align-items: center; justify-content: space-between; background: #ffffff;
            padding: 12px 16px; border-radius: 16px; border: 1px solid #e8e8ed;
        }
        .search-input {
            flex: 1; min-width: 180px; padding: 8px 16px; border-radius: 50px;
            border: 1px solid #d2d2d7; font-size: 13px; outline: none;
        }
        .search-input:focus { border-color: #fb0100; }

        .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .filter-btn {
            background-color: #f5f5f7; border: none; padding: 6px 14px;
            border-radius: 50px; font-size: 12px; font-weight: 500; color: #1d1d1f;
            cursor: pointer; transition: all 0.2s;
        }
        .filter-btn:hover { background-color: #e8e8ed; }
        .filter-btn.active { background-color: #fb0100; color: white; }
        .filter-btn.keep-filter.active { background-color: #1d1d1f; color: white; }

        .autoplay-toggle {
            display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6e6e73;
            cursor: pointer; user-select: none;
        }

        /* スリム・リスト */
        .track-list-container {
            background: #ffffff; border-radius: 16px; border: 1px solid #e8e8ed;
            overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .track-row-wrapper { border-bottom: 1px solid #f5f5f7; }
        .track-row-wrapper:last-child { border-bottom: none; }

        .track-row {
            display: flex; align-items: center; padding: 12px 16px; gap: 16px;
            cursor: pointer; transition: background-color 0.15s ease;
        }
        .track-row:hover { background-color: #fafafa; }

        /* サムネイル ＋ ▶ 再生オーバーレイ */
        .thumb-wrap {
            position: relative;
            border-radius: 6px; overflow: hidden;
            flex-shrink: 0; cursor: pointer;
        }
        .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .thumb-wrap:hover .thumb-overlay { background: rgba(251, 1, 0, 0.8); }
        .play-icon {
            width: 0; height: 0;
            border-style: solid;
            border-width: 5px 0 5px 8px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 2px;
        }

        .track-thumb-list { width: 52px; height: 34px; }

        .track-meta { flex: 1; min-width: 0; }
        .track-title-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .track-title {
            font-size: 14px; font-weight: 600; color: #1d1d1f;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0;
        }
        .category-badge {
            font-size: 10px; background: #f5f5f7; color: #6e6e73;
            padding: 2px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
        }
        .track-desc {
            font-size: 12px; color: #86868b; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; margin: 0;
        }

        /* 再生バー */
        .track-player { width: 250px; flex-shrink: 0; }
        audio { width: 100%; height: 36px; outline: none; }

        .track-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-sm {
            padding: 6px 12px; border-radius: 50px; font-size: 11px; font-weight: 600;
            border: none; cursor: pointer; text-decoration: none; transition: all 0.2s; white-space: nowrap;
        }
        .btn-yt { background: #f5f5f7; color: #1d1d1f; }
        .btn-yt:hover { background: #e8e8ed; }
        .btn-keep { background: #f5f5f7; color: #1d1d1f; border: 1px solid #e8e8ed; }
        .btn-keep.active { background: #1d1d1f; color: white; border-color: #1d1d1f; }
        .btn-dl { background: #fb0100; color: white; }
        .btn-dl:hover { background: #d90100; }

        /* アコーディオン詳細 */
        .track-details {
            display: none; background: #fbfbfd; padding: 16px 20px;
            border-top: 1px dashed #e8e8ed; font-size: 13px; color: #424245;
        }
        .track-details.open { display: block; }
        .details-content { display: flex; flex-direction: column; gap: 10px; }
        .details-share {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            background: white; padding: 10px 14px; border-radius: 10px; border: 1px solid #e8e8ed;
        }
        .share-url { font-family: monospace; font-size: 11px; color: #6e6e73; flex: 1; min-width: 160px; overflow: hidden; text-overflow: ellipsis; }

        /* モーダル */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 200;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: white; border-radius: 24px; max-width: 480px; width: 100%;
            padding: 28px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center;
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px; border: none; background: #f5f5f7;
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold;
        }

        footer { text-align: center; padding: 40px 20px 20px 20px; font-size: 12px; color: #86868b; }
        footer a { color: #6e6e73; text-decoration: none; margin: 0 8px; }

        /* レスポンシブ（スマホ最適化） */
        @media (max-width: 600px) {
            .featured-bottom {
                flex-direction: column; align-items: stretch; gap: 10px;
            }
            .featured-audio { width: 100%; min-width: 0; }
            .featured-actions { justify-content: flex-end; width: 100%; }
        }

        @media (max-width: 768px) {
            .track-row { flex-wrap: wrap; gap: 10px; padding: 12px; }
            .track-player { width: 100%; order: 3; }
            .track-actions { width: 100%; justify-content: flex-end; order: 4; }
            .hamburger-btn { display: flex; }
            .nav-links {
                display: none; position: absolute; top: 100%; left: -20px; right: -20px;
                background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
                flex-direction: column; padding: 16px 24px; gap: 16px; border-bottom: 1px solid rgba(0,0,0,0.08);
            }
            .nav-links.active { display: flex; }
        }
    </style>
</head>
<body>

    <header class="nav-bar">
        <div class="nav-container">
            <a href="./index.html" class="nav-logo">
                <img src="./logo.png" alt="Logo">
                T-Sounds <span>BGM</span>
            </a>
            <button class="hamburger-btn" onclick="toggleMenu()" aria-label="メニュー">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <nav class="nav-links" id="nav-links">
                <a href="./terms.html" class="nav-link">利用規約</a>
                <a href="./privacy.html" class="nav-link">プライバシーポリシー</a>
                <a href="./contact.html" class="nav-link">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="header">
            <img src="./logo.png" alt="T-Sounds Logo" class="header-logo">
            <h1>T-Sounds</h1>
            <p>Premium Free BGM Library</p>
        </div>

        <!-- 個別アクセス時の案内バナー -->
        <div id="single-notice" class="single-notice" style="display: none;">
            <p>指定された楽曲を表示しています</p>
            <button class="btn-sm btn-yt" onclick="clearSingleFilter()">すべての曲を見る</button>
        </div>

        <!-- Today's Pick Up -->
        <div id="featured-container" class="featured-section" style="display: none;">
            <div class="featured-header">
                <span class="featured-badge">Today's Pick Up</span>
                <button class="shuffle-btn" onclick="renderRandomFeatured()">他のおすすめを見る</button>
            </div>
            <div id="featured-card-slot"></div>
        </div>

        <!-- ツールバー -->
        <div class="toolbar">
            <input type="text" id="search-input" class="search-input" placeholder="曲名・キーワードで検索..." oninput="onSearchInput()">
            <div class="filters">
                <button class="filter-btn active" onclick="filterTracks('all', this)">すべて</button>
                <button class="filter-btn keep-filter" id="filter-keep-btn" onclick="filterTracks('keep', this)">キープ (0)</button>
                <button class="filter-btn" onclick="filterTracks('集中', this)">集中</button>
                <button class="filter-btn" onclick="filterTracks('Vlog', this)">Vlog</button>
                <button class="filter-btn" onclick="filterTracks('ゲーム', this)">ゲーム</button>
                <button class="filter-btn" onclick="filterTracks('リラックス', this)">リラックス</button>
            </div>
            <label class="autoplay-toggle">
                <input type="checkbox" id="autoplay-checkbox"> 連続再生
            </label>
        </div>

        <div id="loading" style="text-align: center; color: #86868b; padding: 40px 0;">楽曲データを読み込んでいます...</div>
        
        <div class="track-list-container" id="track-list" style="display: none;"></div>
    </div>

    <!-- モーダル -->
    <div id="modal-download" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-download')">×</button>
            <img src="./logo.png" alt="Logo" style="width: 40px; height: 40px; margin-bottom: 8px;">
            <h3 style="margin: 0 0 8px 0; font-size: 18px;">ダウンロードありがとうございます</h3>
            <p style="font-size: 12px; color: #6e6e73; margin-bottom: 16px;">クレジット表記にご協力いただけると幸いです（任意）。</p>
            <div style="background: #f5f5f7; padding: 8px 12px; border-radius: 8px; font-family: monospace; font-size: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span id="credit-text">BGM: T-Sounds</span>
                <button onclick="copyCredit()" id="copy-btn" style="border: 1px solid #d2d2d7; background: white; border-radius: 50px; font-size: 11px; cursor: pointer;">コピー</button>
            </div>
            <a href="https://www.youtube.com/@t-sounds0511?sub_confirmation=1" target="_blank" class="btn-sm btn-dl" style="display: block; padding: 10px; text-decoration: none;">YouTubeチャンネル登録</a>
        </div>
    </div>

    <footer>
        <p>© T-Sounds All Rights Reserved.</p>
        <p><a href="./terms.html">利用規約</a> | <a href="./privacy.html">プライバシーポリシー</a> | <a href="./contact.html">お問い合わせ</a></p>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby2O2yfcWU9Z2ZADr-Mf81gbuSJB1AIk6SzccIKCAlRVyAh_UTw3rrbtHdM449ELYti/exec';
        let allTracks = []; 
        let currentCategory = 'all';
        let keptTrackIds = JSON.parse(localStorage.getItem('keptTrackIds') || '[]');

        async function fetchTracks() {
            try {
                const response = await fetch(API_URL);
                allTracks = await response.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('track-list').style.display = 'block';

                updateKeepBadgeCount();

                const urlParams = new URLSearchParams(window.location.search);
                const targetVid = urlParams.get('v');

                if (targetVid) {
                    const filtered = allTracks.filter(track => track.youtube_id === targetVid);
                    document.getElementById('single-notice').style.display = 'flex';
                    renderTrackList(filtered);
                } else {
                    renderTrackList(allTracks);
                    renderRandomFeatured();
                }
            } catch (error) {
                document.getElementById('loading').innerText = 'データの読み込みに失敗しました。';
            }
        }

        function clearSingleFilter() {
            window.history.replaceState({}, document.title, window.location.pathname);
            document.getElementById('single-notice').style.display = 'none';
            renderTrackList(allTracks);
            renderRandomFeatured();
        }

        function renderRandomFeatured() {
            if (allTracks.length === 0) return;
            const randomIndex = Math.floor(Math.random() * allTracks.length);
            const track = allTracks[randomIndex];
            
            const isKept = keptTrackIds.includes(track.youtube_id);
            const keepClass = isKept ? 'btn-sm btn-keep active' : 'btn-sm btn-keep';
            const keepText = isKept ? 'キープ中' : 'キープ';

            const slot = document.getElementById('featured-card-slot');
            slot.innerHTML = `
                <div class="featured-card">
                    <div class="featured-top">
                        <div class="thumb-wrap featured-thumb-wrap" onclick="playAudio('feat-audio')" title="再生/一時停止">
                            <img src="https://img.youtube.com/vi/${track.youtube_id}/maxresdefault.jpg" alt="サムネ">
                            <div class="thumb-overlay"><div class="play-icon" style="border-width:6px 0 6px 9px;"></div></div>
                        </div>
                        <div class="featured-meta">
                            <h3 class="featured-title">${track.title}</h3>
                            <p class="featured-desc">${track.description || '本日のおすすめフリーBGM素材です。'}</p>
                        </div>
                    </div>
                    <div class="featured-bottom">
                        <audio id="feat-audio" controls controlsList="nodownload" preload="none" class="featured-audio">
                            <source src="${track.preview_url}" type="audio/mpeg">
                        </audio>
                        <div class="featured-actions">
                            <button onclick="toggleKeep('${track.youtube_id}')" data-keep-id="${track.youtube_id}" class="${keepClass}">${keepText}</button>
                            <button onclick="handleDownload('${track.preview_url}')" class="btn-sm btn-dl">Download</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('featured-container').style.display = 'block';
        }

        /* ページ最上部に戻らないピンポイントキープ処理 */
        function toggleKeep(youtubeId) {
            const index = keptTrackIds.indexOf(youtubeId);
            if (index === -1) { 
                keptTrackIds.push(youtubeId); 
            } else { 
                keptTrackIds.splice(index, 1); 
            }
            localStorage.setItem('keptTrackIds', JSON.stringify(keptTrackIds));
            updateKeepBadgeCount();

            // キープタブ閲覧時のみリストを絞り込み再構築（スクロール位置維持）
            if (currentCategory === 'keep') {
                const currentScroll = window.scrollY;
                applyFilters();
                window.scrollTo(0, currentScroll);
            } else {
                // 通常タブ時はリスト全体の再描画を回避し、対象ボタンのみをピンポイント更新
                const isKept = keptTrackIds.includes(youtubeId);
                document.querySelectorAll(`button[data-keep-id="${youtubeId}"]`).forEach(btn => {
                    if (isKept) {
                        btn.className = 'btn-sm btn-keep active';
                        btn.innerText = 'キープ中';
                    } else {
                        btn.className = 'btn-sm btn-keep';
                        btn.innerText = 'キープ';
                    }
                });
            }
        }

        function updateKeepBadgeCount() {
            const keepBtn = document.getElementById('filter-keep-btn');
            if (keepBtn) keepBtn.innerText = `キープ (${keptTrackIds.length})`;
        }

        function toggleAccordion(id, event) {
            if (event.target.closest('audio') || event.target.closest('button') || event.target.closest('a') || event.target.closest('input') || event.target.closest('.thumb-wrap')) {
                return;
            }
            const el = document.getElementById(`details-${id}`);
            if (el) el.classList.toggle('open');
        }

        function playAudio(audioId) {
            const audio = document.getElementById(audioId);
            if (audio) {
                if (audio.paused) {
                    audio.play().catch(err => console.log("再生エラー:", err));
                } else {
                    audio.pause();
                }
            }
        }

        function shareTrack(title, vid, btn) {
            const shareUrl = `https://t-sounds.com/?v=${vid}`;
            if (navigator.share) {
                navigator.share({
                    title: `${title} | T-Sounds`,
                    text: `フリーBGM素材「${title}」をチェック！`,
                    url: shareUrl
                }).catch(() => {});
            } else {
                const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(`フリーBGM「${title}」`)}&url=${encodeURIComponent(shareUrl)}`;
                window.open(xUrl, '_blank');
            }
        }

        function copyShareUrl(vid, btn) {
            const shareUrl = `https://t-sounds.com/?v=${vid}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                btn.innerText = 'コピー完了';
                setTimeout(() => btn.innerText = 'URLコピー', 2000);
            });
        }

        function applyFilters() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            
            const filtered = allTracks.filter(track => {
                let matchesCat = false;
                if (currentCategory === 'all') matchesCat = true;
                else if (currentCategory === 'keep') matchesCat = keptTrackIds.includes(track.youtube_id);
                else matchesCat = track.tags ? track.tags.includes(currentCategory) : false;

                const titleMatch = track.title ? track.title.toLowerCase().includes(keyword) : false;
                const descMatch = track.description ? track.description.toLowerCase().includes(keyword) : false;
                return matchesCat && (!keyword || titleMatch || descMatch);
            });

            renderTrackList(filtered);
        }

        function filterTracks(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (element) element.classList.add('active');
            applyFilters();
        }

        function onSearchInput() { applyFilters(); }

        function renderTrackList(tracks) {
            const container = document.getElementById('track-list');
            container.innerHTML = '';

            if (tracks.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: #86868b; font-size: 13px;">該当する楽曲が見つかりませんでした。</div>';
                return;
            }

            tracks.forEach((track, idx) => {
                const isKept = keptTrackIds.includes(track.youtube_id);
                const keepClass = isKept ? 'btn-sm btn-keep active' : 'btn-sm btn-keep';
                const keepText = isKept ? 'キープ中' : 'キープ';
                const category = track.tags ? track.tags.split(',')[0].trim() : 'BGM';
                const audioId = `audio-${idx}`;

                const html = `
                    <div class="track-row-wrapper">
                        <div class="track-row" onclick="toggleAccordion('${track.youtube_id}', event)">
                            <div class="thumb-wrap track-thumb-list" onclick="playAudio('${audioId}')" title="再生/一時停止">
                                <img src="https://img.youtube.com/vi/${track.youtube_id}/mqdefault.jpg" alt="サムネ" loading="lazy">
                                <div class="thumb-overlay"><div class="play-icon"></div></div>
                            </div>
                            <div class="track-meta">
                                <div class="track-title-wrap">
                                    <h3 class="track-title">${track.title}</h3>
                                    <span class="category-badge">${category}</span>
                                </div>
                                <p class="track-desc">${track.description || '詳細を見る（タップ）'}</p>
                            </div>
                            <div class="track-player">
                                <audio id="${audioId}" controls controlsList="nodownload" preload="none" data-index="${idx}">
                                    <source src="${track.preview_url}" type="audio/mpeg">
                                </audio>
                            </div>
                            <div class="action-buttons track-actions">
                                <a href="https://www.youtube.com/watch?v=${track.youtube_id}" target="_blank" class="btn-sm btn-yt">YouTube</a>
                                <button onclick="toggleKeep('${track.youtube_id}')" data-keep-id="${track.youtube_id}" class="${keepClass}">${keepText}</button>
                                <button onclick="handleDownload('${track.preview_url}')" class="btn-sm btn-dl">Download</button>
                            </div>
                        </div>
                        <div class="track-details" id="details-${track.youtube_id}">
                            <div class="details-content">
                                <div><strong>【楽曲説明】</strong> ${track.description || '商用利用・個人利用可能なフリーBGMです。'}</div>
                                <div class="details-share">
                                    <span>直接リンク:</span>
                                    <span class="share-url">https://t-sounds.com/?v=${track.youtube_id}</span>
                                    <button class="btn-sm btn-yt" onclick="copyShareUrl('${track.youtube_id}', this)">URLコピー</button>
                                    <button class="btn-sm btn-yt" style="background:#fb0100; color:white;" onclick="shareTrack('${track.title}', '${track.youtube_id}', this)">共有</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function handleDownload(fileUrl) {
            const a = document.createElement('a');
            a.href = fileUrl; a.download = '';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);

            const hideUntil = localStorage.getItem('hideDownloadModalUntil');
            const now = new Date().getTime();
            if (!hideUntil || now > parseInt(hideUntil, 10)) {
                openModal('modal-download');
            }
        }

        function copyCredit() {
            navigator.clipboard.writeText('BGM: T-Sounds').then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = 'コピー完了';
                setTimeout(() => btn.innerText = 'コピー', 2000);
            });
        }

        function toggleMenu() { document.getElementById('nav-links').classList.toggle('active'); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        document.addEventListener('play', function(e){
            const target = e.target;
            if (target.tagName === 'AUDIO') {
                const audios = document.getElementsByTagName('audio');
                for(let i = 0; i < audios.length; i++){
                    if(audios[i] !== target) audios[i].pause();
                }
            }
        }, true);

        document.addEventListener('ended', function(e){
            const autoplay = document.getElementById('autoplay-checkbox').checked;
            if (autoplay && e.target.tagName === 'AUDIO') {
                const currentIndex = parseInt(e.target.getAttribute('data-index'), 10);
                const audios = document.querySelectorAll('#track-list audio');
                if (audios[currentIndex + 1]) {
                    audios[currentIndex + 1].play();
                }
            }
        }, true);

        fetchTracks();
    </script>
</body>
</html>
