<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Sounds | Premium Free BGM Library</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
            background-color: #fbfbfd;
            color: #1d1d1f;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #1d1d1f;
            margin-bottom: 5px;
            font-size: 32px;
        }

        /* 検索バー＆フィルターエリア */
        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid #d2d2d7;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: #fb0100;
            box-shadow: 0 0 0 3px rgba(251, 1, 0, 0.1);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #f5f5f7;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            color: #1d1d1f;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background-color: #e8e8ed;
        }
        .filter-btn.active {
            background-color: #fb0100;
            color: white;
        }

        /* トラックカード */
        .track-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .track-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }
        
        .thumbnail {
            width: 160px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            object-fit: cover;
            background-color: #f2f2f2;
        }

        .track-info {
            flex-grow: 1;
        }
        .track-title {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 6px 0;
        }
        .track-desc {
            font-size: 13px;
            color: #6e6e73;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .tag {
            display: inline-block;
            background: #f5f5f7;
            padding: 4px 10px;
            border-radius: 50px;
            margin-right: 4px;
            font-size: 11px;
            color: #555;
            cursor: pointer;
        }
        .tag:hover {
            background-color: #e8e8ed;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            min-width: 260px;
        }
        audio {
            height: 36px;
            width: 100%;
            outline: none;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .yt-link, .download-btn {
            color: #1d1d1f;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            flex: 1;
            transition: background-color 0.2s;
        }
        .yt-link { background-color: #f5f5f7; }
        .yt-link:hover { background-color: #e8e8ed; }
        .download-btn { background-color: #fb0100; color: white; }
        .download-btn:hover { background-color: #d90100; }

        @media (max-width: 768px) {
            .track-card { flex-direction: column; align-items: flex-start; }
            .thumbnail, .controls { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>T-Sounds</h1>
            <p>Premium Free BGM Library</p>
        </div>

        <!-- リアルタイム検索窓 -->
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="キーワード・タイトル・タグで検索..." oninput="onSearchInput()">
        </div>

        <!-- タグフィルター -->
        <div class="filters" id="filter-container">
            <button class="filter-btn active" onclick="filterTracks('all', this)">すべて</button>
            <button class="filter-btn" onclick="filterTracks('集中', this)">集中</button>
            <button class="filter-btn" onclick="filterTracks('Vlog', this)">Vlog</button>
            <button class="filter-btn" onclick="filterTracks('ゲーム', this)">ゲーム</button>
            <button class="filter-btn" onclick="filterTracks('ピアノ', this)">ピアノ</button>
        </div>

        <div id="loading" style="text-align: center; color: #86868b;">楽曲データを読み込んでいます...</div>
        <div id="track-list"></div>
    </div>

    <script>
        // ★ここにGASのURLを貼り付けてください★
        const API_URL = 'https://script.google.com/macros/s/AKfycby2O2yfcWU9Z2ZADr-Mf81gbuSJB1Alk6SzccIKCAIRVyAh_UTw3rrbtHdM449ELYti/exec';
        
        let allTracks = []; 
        let currentTag = 'all';

        async function fetchTracks() {
            try {
                const response = await fetch(API_URL);
                allTracks = await response.json();
                document.getElementById('loading').style.display = 'none';

                const urlParams = new URLSearchParams(window.location.search);
                const targetVid = urlParams.get('v');

                if (targetVid) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    const filtered = allTracks.filter(track => track.youtube_id === targetVid);
                    renderTrackCards(filtered);
                } else {
                    renderTrackCards(allTracks);
                }
            } catch (error) {
                console.error('通信エラー:', error);
                document.getElementById('loading').innerText = 'データの読み込みに失敗しました。';
            }
        }

        // 検索＆タグフィルターの統合処理
        function applyFilters() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            
            const filtered = allTracks.filter(track => {
                // タグの一致チェック
                const matchesTag = currentTag === 'all' || track.tags.includes(currentTag);
                
                // キーワードの一致チェック（タイトル、タグ、概要欄から検索）
                const titleMatch = track.title ? track.title.toLowerCase().includes(keyword) : false;
                const tagMatch = track.tags ? track.tags.toLowerCase().includes(keyword) : false;
                const descMatch = track.description ? track.description.toLowerCase().includes(keyword) : false;
                const matchesKeyword = !keyword || titleMatch || tagMatch || descMatch;

                return matchesTag && matchesKeyword;
            });

            renderTrackCards(filtered);
        }

        function filterTracks(tag, element) {
            currentTag = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (element) element.classList.add('active');
            applyFilters();
        }

        function onSearchInput() {
            applyFilters();
        }

        function renderTrackCards(tracks) {
            const trackList = document.getElementById('track-list');
            trackList.innerHTML = ''; 

            if (tracks.length === 0) {
                trackList.innerHTML = '<p style="text-align:center; color:#86868b; padding:40px 0;">該当する楽曲が見つかりませんでした。</p>';
                return;
            }

            tracks.forEach(track => {
                const tagsArray = track.tags ? track.tags.split(',') : [];
                const tagsHtml = tagsArray.map(tag => `<span class="tag" onclick="filterTracks('${tag.trim()}', null)">${tag.trim()}</span>`).join('');
                const descHtml = track.description ? `<p class="track-desc">${track.description}</p>` : '';

                const cardHtml = `
                    <div class="track-card">
                        <!-- loading="lazy" で遅延読み込み -->
                        <img src="https://img.youtube.com/vi/${track.youtube_id}/maxresdefault.jpg" class="thumbnail" alt="サムネイル" loading="lazy">
                        
                        <div class="track-info">
                            <h2 class="track-title">${track.title}</h2>
                            ${descHtml}
                            <div>${tagsHtml}</div>
                        </div>

                        <div class="controls">
                            <audio controls controlsList="nodownload" preload="none">
                                <source src="${track.preview_url}" type="audio/mpeg">
                            </audio>
                            <div class="action-buttons">
                                <a href="https://www.youtube.com/watch?v=${track.youtube_id}" target="_blank" class="yt-link">▶ YouTube</a>
                                <a href="${track.preview_url}" download class="download-btn">Download</a>
                            </div>
                        </div>
                    </div>
                `;
                trackList.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // 排他制御（どれかが再生されたら他を止める）
        document.addEventListener('play', function(e){
            const audios = document.getElementsByTagName('audio');
            for(let i = 0, len = audios.length; i < len;i++){
                if(audios[i] != e.target){
                    audios[i].pause();
                }
            }
        }, true);

        fetchTracks();
    </script>
</body>
</html>
