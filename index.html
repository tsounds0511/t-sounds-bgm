<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Sounds | Premium Free BGM Library</title>
    <link rel="icon" href="./logo.png" type="image/png">

    <!-- GA4 タグ -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BPGEB13LX4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BPGEB13LX4');
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
            background-color: #fbfbfd;
            color: #1d1d1f;
            margin: 0;
            padding: 0 0 60px 0;
        }

        /* ヘッダーナビゲーション */
        .nav-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 10px 20px;
        }
        .nav-container {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-weight: 700; font-size: 16px; color: #1d1d1f;
            text-decoration: none; display: flex; align-items: center; gap: 8px;
        }
        .nav-logo img { height: 22px; }
        .nav-logo span { color: #fb0100; }
        .nav-links { display: flex; gap: 20px; }
        .nav-link { color: #6e6e73; text-decoration: none; font-size: 13px; font-weight: 500; }
        .nav-link:hover { color: #fb0100; }

        .hamburger-btn {
            display: none; background: none; border: none; cursor: pointer; padding: 4px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 30px 20px 0 20px;
        }
        
        .header { text-align: center; margin-bottom: 24px; }
        .header-logo { width: 48px; height: 48px; object-fit: contain; margin-bottom: 8px; }
        .header h1 { color: #1d1d1f; margin: 0 0 4px 0; font-size: 28px; letter-spacing: -0.5px; }
        .header p { margin: 0; color: #6e6e73; font-size: 13px; }

        /* 検索＆カテゴリフィルター */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #e8e8ed;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid #d2d2d7;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus { border-color: #fb0100; }

        .filters { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-btn {
            background-color: #f5f5f7; border: none;
            padding: 6px 14px; border-radius: 50px;
            font-size: 12px; font-weight: 500; color: #1d1d1f;
            cursor: pointer; transition: all 0.2s;
        }
        .filter-btn:hover { background-color: #e8e8ed; }
        .filter-btn.active { background-color: #fb0100; color: white; }
        .filter-btn.keep-filter.active { background-color: #1d1d1f; color: white; }

        /* リストテーブル形式のトラック一覧 */
        .track-list-container {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e8e8ed;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .track-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f5f5f7;
            gap: 16px;
            transition: background-color 0.15s ease;
        }
        .track-row:last-child { border-bottom: none; }
        .track-row:hover { background-color: #fafafa; }

        /* ミニサムネイル */
        .track-thumb {
            width: 56px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            background: #eee;
            flex-shrink: 0;
        }

        /* 曲情報 */
        .track-meta {
            flex: 1;
            min-width: 0;
        }
        .track-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
        }
        .track-title {
            font-size: 15px;
            font-weight: 600;
            color: #1d1d1f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }
        .category-badge {
            font-size: 10px;
            background: #f5f5f7;
            color: #6e6e73;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .track-desc {
            font-size: 12px;
            color: #86868b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }

        /* プレイヤー & 操作ボタン */
        .track-player {
            width: 180px;
            flex-shrink: 0;
        }
        audio { width: 100%; height: 32px; outline: none; }

        .track-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .btn-sm {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-yt { background: #f5f5f7; color: #1d1d1f; }
        .btn-yt:hover { background: #e8e8ed; }
        .btn-keep { background: #f5f5f7; color: #1d1d1f; border: 1px solid #e8e8ed; }
        .btn-keep.active { background: #1d1d1f; color: white; border-color: #1d1d1f; }
        .btn-dl { background: #fb0100; color: white; }
        .btn-dl:hover { background: #d90100; }

        /* モーダル */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 200;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: white; border-radius: 24px; max-width: 480px; width: 100%;
            padding: 28px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px; border: none; background: #f5f5f7;
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold;
        }

        footer { text-align: center; padding: 40px 20px 20px 20px; font-size: 12px; color: #86868b; }
        footer a { color: #6e6e73; text-decoration: none; margin: 0 8px; }

        @media (max-width: 768px) {
            .track-row { flex-wrap: wrap; gap: 10px; padding: 14px 12px; }
            .track-player { width: 100%; order: 3; }
            .track-actions { width: 100%; justify-content: flex-end; order: 4; }
            .hamburger-btn { display: flex; }
            .nav-links {
                display: none; position: absolute; top: 100%; left: -20px; right: -20px;
                background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
                flex-direction: column; padding: 16px 24px; gap: 16px;
                border-bottom: 1px solid rgba(0,0,0,0.08);
            }
            .nav-links.active { display: flex; }
        }
    </style>
</head>
<body>

    <header class="nav-bar">
        <div class="nav-container">
            <a href="./index.html" class="nav-logo">
                <img src="./logo.png" alt="Logo">
                T-Sounds <span>BGM</span>
            </a>
            <button class="hamburger-btn" onclick="toggleMenu()" aria-label="メニュー">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <nav class="nav-links" id="nav-links">
                <a href="./terms.html" class="nav-link">利用規約</a>
                <a href="./privacy.html" class="nav-link">プライバシーポリシー</a>
                <a href="./contact.html" class="nav-link">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="header">
            <img src="./logo.png" alt="T-Sounds Logo" class="header-logo">
            <h1>T-Sounds</h1>
            <p>Premium Free BGM Library</p>
        </div>

        <!-- ツールバー：検索 & カテゴリ -->
        <div class="toolbar">
            <input type="text" id="search-input" class="search-input" placeholder="曲名・キーワードで検索..." oninput="onSearchInput()">
            <div class="filters">
                <button class="filter-btn active" onclick="filterTracks('all', this)">すべて</button>
                <button class="filter-btn keep-filter" id="filter-keep-btn" onclick="filterTracks('keep', this)">キープ (0)</button>
                <button class="filter-btn" onclick="filterTracks('集中', this)">集中</button>
                <button class="filter-btn" onclick="filterTracks('Vlog', this)">Vlog</button>
                <button class="filter-btn" onclick="filterTracks('ゲーム', this)">ゲーム</button>
                <button class="filter-btn" onclick="filterTracks('チル', this)">チル</button>
            </div>
        </div>

        <div id="loading" style="text-align: center; color: #86868b; padding: 40px 0;">楽曲データを読み込んでいます...</div>
        
        <!-- スリムなトラックリスト -->
        <div class="track-list-container" id="track-list" style="display: none;"></div>
    </div>

    <!-- ダウンロードモーダル -->
    <div id="modal-download" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-download')">×</button>
            <img src="./logo.png" alt="Logo" style="width: 40px; height: 40px; margin-bottom: 8px;">
            <h3 style="margin: 0 0 8px 0; font-size: 18px;">ダウンロードありがとうございます</h3>
            <p style="font-size: 12px; color: #6e6e73; margin-bottom: 16px;">クレジット表記にご協力いただけると幸いです（任意）。</p>
            <div style="background: #f5f5f7; padding: 8px 12px; border-radius: 8px; font-family: monospace; font-size: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span id="credit-text">BGM: T-Sounds</span>
                <button onclick="copyCredit()" id="copy-btn" style="border: 1px solid #d2d2d7; background: white; border-radius: 50px; padding: 4px 10px; font-size: 11px; cursor: pointer;">コピー</button>
            </div>
            <a href="https://www.youtube.com/@t-sounds0511?sub_confirmation=1" target="_blank" class="btn-sm btn-dl" style="display: block; padding: 10px; text-decoration: none;">YouTubeチャンネル登録</a>
        </div>
    </div>

    <footer>
        <p>© T-Sounds All Rights Reserved.</p>
        <p><a href="./terms.html">利用規約</a> | <a href="./privacy.html">プライバシーポリシー</a> | <a href="./contact.html">お問い合わせ</a></p>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby2O2yfcWU9Z2ZADr-Mf81gbuSJB1Alk6SzccIKCAIRVyAh_UTw3rrbtHdM449ELYti/exec';
        let allTracks = []; 
        let currentCategory = 'all';
        let keptTrackIds = JSON.parse(localStorage.getItem('keptTrackIds') || '[]');

        async function fetchTracks() {
            try {
                const response = await fetch(API_URL);
                allTracks = await response.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('track-list').style.display = 'block';

                updateKeepBadgeCount();

                const urlParams = new URLSearchParams(window.location.search);
                const targetVid = urlParams.get('v');

                if (targetVid) {
                    const filtered = allTracks.filter(track => track.youtube_id === targetVid);
                    renderTrackList(filtered);
                } else {
                    renderTrackList(allTracks);
                }
            } catch (error) {
                document.getElementById('loading').innerText = 'データの読み込みに失敗しました。';
            }
        }

        function toggleKeep(youtubeId) {
            const index = keptTrackIds.indexOf(youtubeId);
            if (index === -1) { keptTrackIds.push(youtubeId); } 
            else { keptTrackIds.splice(index, 1); }
            localStorage.setItem('keptTrackIds', JSON.stringify(keptTrackIds));
            updateKeepBadgeCount();
            applyFilters();
        }

        function updateKeepBadgeCount() {
            const keepBtn = document.getElementById('filter-keep-btn');
            if (keepBtn) keepBtn.innerText = `キープ (${keptTrackIds.length})`;
        }

        function applyFilters() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            
            const filtered = allTracks.filter(track => {
                let matchesCat = false;
                if (currentCategory === 'all') matchesCat = true;
                else if (currentCategory === 'keep') matchesCat = keptTrackIds.includes(track.youtube_id);
                else matchesCat = track.tags ? track.tags.includes(currentCategory) : false;

                const titleMatch = track.title ? track.title.toLowerCase().includes(keyword) : false;
                const descMatch = track.description ? track.description.toLowerCase().includes(keyword) : false;
                const matchesKeyword = !keyword || titleMatch || descMatch;

                return matchesCat && matchesKeyword;
            });

            renderTrackList(filtered);
        }

        function filterTracks(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (element) element.classList.add('active');
            applyFilters();
        }

        function onSearchInput() { applyFilters(); }

        function renderTrackList(tracks) {
            const container = document.getElementById('track-list');
            container.innerHTML = '';

            if (tracks.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: #86868b; font-size: 13px;">該当する楽曲が見つかりませんでした。</div>';
                return;
            }

            tracks.forEach(track => {
                const isKept = keptTrackIds.includes(track.youtube_id);
                const keepClass = isKept ? 'btn-sm btn-keep active' : 'btn-sm btn-keep';
                const keepText = isKept ? 'キープ中' : 'キープ';
                const category = track.tags ? track.tags.split(',')[0].trim() : 'BGM';

                const html = `
                    <div class="track-row">
                        <img src="https://img.youtube.com/vi/${track.youtube_id}/mqdefault.jpg" class="track-thumb" alt="サムネ" loading="lazy">
                        <div class="track-meta">
                            <div class="track-title-wrap">
                                <h3 class="track-title">${track.title}</h3>
                                <span class="category-badge">${category}</span>
                            </div>
                            <p class="track-desc">${track.description || 'フリーBGM素材'}</p>
                        </div>
                        <div class="track-player">
                            <audio controls controlsList="nodownload" preload="none">
                                <source src="${track.preview_url}" type="audio/mpeg">
                            </audio>
                        </div>
                        <div class="action-buttons track-actions">
                            <a href="https://www.youtube.com/watch?v=${track.youtube_id}" target="_blank" class="btn-sm btn-yt">YouTube</a>
                            <button onclick="toggleKeep('${track.youtube_id}')" class="${keepClass}">${keepText}</button>
                            <button onclick="handleDownload('${track.preview_url}')" class="btn-sm btn-dl">Download</button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function handleDownload(fileUrl) {
            const a = document.createElement('a');
            a.href = fileUrl; a.download = '';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);

            const hideUntil = localStorage.getItem('hideDownloadModalUntil');
            const now = new Date().getTime();
            if (!hideUntil || now > parseInt(hideUntil, 10)) {
                openModal('modal-download');
            }
        }

        function copyCredit() {
            navigator.clipboard.writeText('BGM: T-Sounds').then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = 'コピー完了';
                setTimeout(() => btn.innerText = 'コピー', 2000);
            });
        }

        function toggleMenu() { document.getElementById('nav-links').classList.toggle('active'); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        document.addEventListener('play', function(e){
            const audios = document.getElementsByTagName('audio');
            for(let i = 0; i < audios.length; i++){
                if(audios[i] != e.target) audios[i].pause();
            }
        }, true);

        fetchTracks();
    </script>
</body>
</html>
